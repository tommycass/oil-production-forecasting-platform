name: 'oil_dw'
version: '1.0.0'
config-version: 2

# Perfil de conexión (ver profiles.yml en este mismo directorio).
profile: 'oil_dw'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Capas Medallion (ADR-014). Cada carpeta materializa en su propio esquema Postgres.
models:
  oil_dw:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table

# Data Quality (ADR-016): los resultados se persisten.
#  - store_failures: las filas que fallan cada test quedan en tablas del esquema dq.
#  - on-run-end: además consolidamos pass/fail de cada check en dq.dq_results.
data_tests:
  oil_dw:
    +store_failures: true
    +schema: dq

on-run-end:
  - "{{ log_dq_results() }}"
