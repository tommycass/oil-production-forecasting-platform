name: CI

permissions:
  id-token: write # Permiso CLAVE para que funcione OIDC con AWS
  contents: read
  packages: write

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install -r api/requirements-dev.txt

      - name: Static analysis
        run: ruff check api/app/

      - name: Run tests
        run: pytest api/tests/ -v
        env:
          API_KEY: abcdef12345

  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: pip install -r data_pipeline/requirements-dev.txt

      - name: Run pipeline tests
        run: pytest data_pipeline/tests/ -v

  test-ml:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install -r api/requirements-dev.txt

      - name: Run ML serving tests
        run: pytest api/tests/test_predict.py -v
        env:
          API_KEY: abcdef12345
          MLFLOW_TRACKING_URI: "sqlite:///test_mlflow.db"

  build:
    runs-on: ubuntu-latest
    needs: [test, test-pipeline, test-ml]
    
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f infra/Dockerfile api/ -t oil-forecast-api:latest

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: oil-forecast-api:latest
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Verify container health
        run: |
          docker run -d --name test-api -p 8000:8000 -e API_KEY=abcdef12345 oil-forecast-api:latest
          sleep 3
          curl --fail http://localhost:8000/health || (docker logs test-api && exit 1)
          docker stop test-api && docker rm test-api

      # AUTENTICACIÓN AWS ECR 
      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to Amazon ECR
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: oil-forecast-api
        run: |
          docker tag oil-forecast-api:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker tag oil-forecast-api:latest $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Solo despliega en main

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy via AWS Systems Manager (SSM)
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=api" \
            --comment "Deploying latest API image" \
            --timeout-seconds 300 \
            --parameters 'commands=[
              "set -e",
              "REPO=597437436418.dkr.ecr.us-east-2.amazonaws.com/oil-forecast-api",
              "aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin $REPO",
              "cd /home/ubuntu/oil-production-forecasting-platform",
              "git config --system --add safe.directory /home/ubuntu/oil-production-forecasting-platform",
              "git fetch origin main",
              "git reset --hard origin/main",
              "echo \"${{ secrets.SLACK_WEBHOOK_URL }}\" > monitoring/.slack_webhook",
              "chown -R ubuntu:ubuntu /home/ubuntu/oil-production-forecasting-platform",
              "PREV_IMAGE=$(docker compose -f infra/docker-compose.yml ps -q api 2>/dev/null | head -1 | xargs -r docker inspect --format \"{{.Image}}\" 2>/dev/null || echo none)",
              "echo \"Previous image digest: $PREV_IMAGE\"",
              "docker compose -f infra/docker-compose.yml pull",
              "docker compose -f infra/docker-compose.yml up -d",
              "sleep 20",
              "HEALTHY=false; for i in 1 2 3 4 5 6; do curl -sf http://localhost:8000/health && HEALTHY=true && break || sleep 10; done",
              "if [ \"$HEALTHY\" != \"true\" ]; then echo \"Health check failed. Rolling back to previous image...\"; if [ \"$PREV_IMAGE\" != \"none\" ] && [ -n \"$PREV_IMAGE\" ]; then docker tag \"$PREV_IMAGE\" \"$REPO:latest\" && docker compose -f infra/docker-compose.yml up -d api && echo \"Rollback complete.\"; fi; exit 1; fi",
              "echo \"Post-deploy health check passed. Service is healthy.\"",
              "docker image prune -af",
              "echo \"Docker image cleanup complete.\""
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Polling for deploy result on EC2..."

          STATUS="InProgress"
          ATTEMPTS=0
          while [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ]; do
            sleep 10
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'CommandInvocations[0].Status' --output text)
            ATTEMPTS=$((ATTEMPTS + 1))
            echo "Attempt $ATTEMPTS — Status: $STATUS"
            if [ "$ATTEMPTS" -ge 36 ]; then
              echo "Timed out waiting for deploy to complete."
              exit 1
            fi
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed on EC2 with status: $STATUS"
            exit 1
          fi

          echo "Deploy completed successfully on production."

  deploy_dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' # Solo despliega en staging

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy via AWS Systems Manager (SSM) to DEV
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=api-dev" \
            --comment "Deploying latest API image to DEV" \
            --timeout-seconds 300 \
            --parameters 'commands=[
              "set -e",
              "REPO=597437436418.dkr.ecr.us-east-2.amazonaws.com/oil-forecast-api",
              "aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin $REPO",
              "cd /home/ubuntu/oil-production-forecasting-platform",
              "git config --system --add safe.directory /home/ubuntu/oil-production-forecasting-platform",
              "git fetch origin staging",
              "git reset --hard origin/staging",
              "echo \"${{ secrets.SLACK_WEBHOOK_URL }}\" > monitoring/.slack_webhook",
              "chown -R ubuntu:ubuntu /home/ubuntu/oil-production-forecasting-platform",
              "PREV_IMAGE=$(docker compose -f infra/docker-compose.yml ps -q api 2>/dev/null | head -1 | xargs -r docker inspect --format \"{{.Image}}\" 2>/dev/null || echo none)",
              "echo \"Previous image digest: $PREV_IMAGE\"",
              "docker compose -f infra/docker-compose.yml pull",
              "docker compose -f infra/docker-compose.yml up -d",
              "sleep 20",
              "HEALTHY=false; for i in 1 2 3 4 5 6; do curl -sf http://localhost:8000/health && HEALTHY=true && break || sleep 10; done",
              "if [ \"$HEALTHY\" != \"true\" ]; then echo \"Health check failed. Rolling back to previous image...\"; if [ \"$PREV_IMAGE\" != \"none\" ] && [ -n \"$PREV_IMAGE\" ]; then docker tag \"$PREV_IMAGE\" \"$REPO:latest\" && docker compose -f infra/docker-compose.yml up -d api && echo \"Rollback complete.\"; fi; exit 1; fi",
              "echo \"Post-deploy health check passed. Service is healthy.\"",
              "docker image prune -af",
              "echo \"Docker image cleanup complete.\""
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Polling for deploy result on EC2..."

          STATUS="InProgress"
          ATTEMPTS=0
          while [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ]; do
            sleep 10
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query 'CommandInvocations[0].Status' --output text)
            ATTEMPTS=$((ATTEMPTS + 1))
            echo "Attempt $ATTEMPTS — Status: $STATUS"
            if [ "$ATTEMPTS" -ge 36 ]; then
              echo "Timed out waiting for deploy to complete."
              exit 1
            fi
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed on EC2 with status: $STATUS"
            exit 1
          fi

          echo "Deploy completed successfully on DEV."