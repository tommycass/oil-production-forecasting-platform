name: CI

permissions:
  id-token: write # Permiso CLAVE para que funcione OIDC con AWS
  contents: read
  packages: write

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install -r api/requirements-dev.txt

      - name: Static analysis
        run: ruff check api/app/

      - name: Run tests
        run: pytest api/tests/ -v
        env:
          API_KEY: abcdef12345

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f infra/Dockerfile api/ -t oil-forecast-api:latest

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: oil-forecast-api:latest
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Verify container health
        run: |
          docker run -d --name test-api -p 8000:8000 -e API_KEY=abcdef12345 oil-forecast-api:latest
          sleep 3
          curl --fail http://localhost:8000/health || (docker logs test-api && exit 1)
          docker stop test-api && docker rm test-api

      # AUTENTICACIÓN AWS ECR 
      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to Amazon ECR
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: oil-forecast-api
        run: |
          docker tag oil-forecast-api:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker tag oil-forecast-api:latest $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Solo despliega en main
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy via AWS Systems Manager (SSM)
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=api" \
            --comment "Deploying latest API image" \
            --parameters 'commands=[
              "echo \"Authenticating with ECR...\"",
              "aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 597437436418.dkr.ecr.us-east-2.amazonaws.com",
              "cd /home/ubuntu/oil-production-forecasting-platform",
              "echo \"Pulling latest code...\"",
              "git pull origin main",
              "echo \"Pulling and starting containers...\"",
              "docker compose -f infra/docker-compose.yml pull",
              "docker compose -f infra/docker-compose.yml up -d"
            ]'