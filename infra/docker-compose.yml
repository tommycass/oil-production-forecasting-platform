services:
  api:
    # Le dice a EC2 de dónde descargar la imagen
    image: 597437436418.dkr.ecr.us-east-2.amazonaws.com/oil-forecast-api:latest

    # build para armar en local
    build:
      context: ../api
      dockerfile: ../infra/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../api/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  grafana-init:
    image: alpine:3.19
    restart: "no"
    environment:
      - EC2_INSTANCE_ID=${EC2_INSTANCE_ID:-unknown}
    volumes:
      - ../monitoring/grafana/dashboards:/dashboards-tpl:ro
      - grafana_dashboards:/dashboards-out
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl >/dev/null 2>&1
        TOKEN=$$(curl -sf -X PUT "http://169.254.169.254/latest/api/token" \
          -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null) || TOKEN=""
        if [ -n "$$TOKEN" ]; then
          INSTANCE_ID=$$(curl -sf -H "X-aws-ec2-metadata-token: $$TOKEN" \
            http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null) || INSTANCE_ID=""
        fi
        if [ -z "$$INSTANCE_ID" ]; then
          INSTANCE_ID="$$EC2_INSTANCE_ID"
        fi
        echo "[grafana-init] resolved EC2 instance id: $$INSTANCE_ID"
        for tpl in /dashboards-tpl/*.tpl; do
          [ -f "$$tpl" ] || continue
          name=$$(basename "$$tpl" .tpl)
          sed "s|__EC2_INSTANCE_ID__|$$INSTANCE_ID|g" "$$tpl" > "/dashboards-out/$$name"
          echo "[grafana-init] generated $$name"
        done

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/api-metrics.json
      - GF_AWS_ALLOWED_AUTH_PROVIDERS=default,credentials,keys,ec2_iam_role
      - GF_AWS_DEFAULT_REGION=us-east-2
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_SIGNOUT_MENU=true
      - GF_USERS_VIEWERS_CAN_EDIT=false
      - GF_EXPLORE_ENABLED=false
      - GF_SNAPSHOTS_EXTERNAL_ENABLED=false
    depends_on:
      prometheus:
        condition: service_started
      grafana-init:
        condition: service_completed_successfully
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  grafana-user-init:
    image: alpine:3.19
    restart: "no"
    depends_on:
      grafana:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl >/dev/null 2>&1
        echo "[user-init] waiting for grafana..."
        until curl -sf http://grafana:3000/api/health >/dev/null 2>&1; do
          sleep 2
        done
        echo "[user-init] grafana ready, ensuring ext_read viewer exists"
        HTTP=$$(curl -s -o /dev/null -w "%{http_code}" -X POST \
          http://admin:admin@grafana:3000/api/admin/users \
          -H "Content-Type: application/json" \
          -d '{"name":"External Reader","login":"ext_read","password":"visitor123"}')
        if [ "$$HTTP" = "200" ]; then
          echo "[user-init] user ext_read created"
        else
          echo "[user-init] user already exists or status=$$HTTP"
        fi

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../monitoring/.slack_webhook:/etc/alertmanager/.slack_webhook:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  # Data Warehouse (Fase 2): Postgres aloja las capas Silver y Gold del modelo
  # estrella y el esquema dq de resultados de calidad.
  #   - staging / local: se levanta este container (perfil "local-db").
  #   - producción: NO se levanta; se usa un Postgres gestionado (RDS) apuntando
  #     las mismas variables de entorno (POSTGRES_HOST/PORT/USER/PASSWORD/DB).
  # El perfil hace que `docker compose up -d` no arranque el container salvo que
  # COMPOSE_PROFILES incluya "local-db" (o se nombre el servicio explícitamente).
  postgres:
    image: postgres:16
    container_name: oil-dw-postgres
    profiles: ["local-db"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-oil}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-oil}
      - POSTGRES_DB=${POSTGRES_DB:-oil_dw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-oil} -d $${POSTGRES_DB:-oil_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  grafana_dashboards:
  postgres_data:
